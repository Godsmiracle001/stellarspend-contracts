[package]
name = "spending_categories"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
shared = { workspace = true }
# Pin ed25519-dalek to 2.x — soroban-env-host declares >=2.0.0
# without an upper bound, letting the resolver select incompatible 3.x.
ed25519-dalek = "=2.2.0"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Pin ed25519-dalek to 2.x — soroban-env-host testutils declares >=2.0.0
# without an upper bound, letting the resolver select incompatible 3.x.
ed25519-dalek = "=2.2.0"
